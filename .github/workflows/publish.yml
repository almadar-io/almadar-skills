name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # pnpm/action-setup@v6 was observed installing pnpm 11.0.0-beta.4-1
      # despite `version: 10.30.3`. Bypass the action; pin via npm.
      - name: Install pnpm 10.30.3 via npm
        run: npm install -g pnpm@10.30.3
      - run: pnpm --version
      - run: pnpm install --no-frozen-lockfile
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: pnpm build

      # Auth via the built-in GITHUB_TOKEN (job grants packages: write and the
      # package is linked to this repo) — it never expires, unlike the
      # GH_PACKAGES_TOKEN PAT that expired 2026-07 and 401'd every publish.
      # The checked-in .npmrc reads the token from ${GH_PACKAGES_TOKEN}, so the
      # GITHUB_TOKEN value is fed through that env var name.
      - name: Publish to GitHub Packages
        run: pnpm publish --no-git-checks --registry https://npm.pkg.github.com
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
