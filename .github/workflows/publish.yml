name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      # pnpm/action-setup@v4 (NOT @v6, which ignored `version:` and installed a
      # pnpm 11 beta). No `version:` input → reads pnpm@10.30.3 from
      # package.json `packageManager`. Must run BEFORE setup-node so pnpm is on
      # PATH when setup-node@v5 reads `packageManager`.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: pnpm build

      # Auth via the built-in GITHUB_TOKEN (job grants packages: write and the
      # package is linked to this repo) — it never expires, unlike the
      # GH_PACKAGES_TOKEN PAT that expired 2026-07 and 401'd every publish.
      # The checked-in .npmrc reads the token from ${GH_PACKAGES_TOKEN}, so the
      # GITHUB_TOKEN value is fed through that env var name.
      - name: Publish to GitHub Packages
        run: pnpm publish --no-git-checks --registry https://npm.pkg.github.com
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
